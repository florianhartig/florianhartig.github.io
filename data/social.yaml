# Single source of truth for profile links.
#
# Used twice: rendered as the link rows on the site, AND emitted as `sameAs` in
# the JSON-LD Person schema. That pairing is the point — `sameAs` is what lets
# search engines and AI systems merge these identities into one entity. Because
# both read this file, they cannot drift apart.
#
# Flags:
#   primary: true   -> shown in the main pill row (otherwise in "also indexed at")
#   person: false   -> visible link, but NOT emitted in the Person `sameAs`.
#                      Use for URLs that identify the *group*, not Florian —
#                      claiming those are "the same as" him would be wrong and
#                      could make search engines merge the two entities.

