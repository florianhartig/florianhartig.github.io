# Publication statistics, shown on the homepage and above the publication list.
#
# These go stale fast, so the template always renders the `as_of` date beside
# them — a figure is never presented as current when it isn't. Update the
# numbers and `as_of` together, or set `show: false` to hide the block.
#
# `*_approx: true` renders the number with a trailing "+" (e.g. "632+"),
# matching the ">632 co-authors" phrasing of the source.
#
# Note: the Articles figure is NOT read from this file — it's counted live
# from content/publications/ in layouts/_partials/metrics.html, so it can't
# go stale as entries are added. Don't add an `articles` field back here.
show: true
as_of: "October 2026"

