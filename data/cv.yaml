# The career line (layouts/_partials/cv-strip.html): one non-overlapping
# sequence of stages, coarser than the lists above (Berlin and Uppsala as one
# study phase, W2 and W3 as one Regensburg phase). Keep in step with them.
# `short` (role) and `place` are kept to one short line each, so all stages
# line up. Shown on the homepage and at the top of the CV page.
career_strip:
  - period: "2001 – 2006"
    short: "Physics"
    place: "Berlin, Uppsala"
  - period: "2006 – 2009"
    short: "PhD"
    place: "Leipzig"
  - period: "2009 – 2012"
    short: "Postdoc"
    place: "Leipzig"
  - period: "2012 – 2016"
    short: "Lecturer"
    place: "Freiburg"
  - period: "2016 – now"
    short: "Professor"
    place: "Regensburg"

# Degree-granting institutions, emitted as schema.org `alumniOf`.
