# One figure per publication page, only for CC-licensed papers (since 18 Oct 2026).
# Written by scripts/add_figure.py — use it rather than editing by hand.
# Key = .bib key; image = assets/images/publications/<key>.jpg (≤ 1600 px,
# metadata stripped, otherwise unchanged). `caption` is the figure title copied
# verbatim from the publisher page (also the alt text); `source` is the page the
# figure was taken from. Credit line and licence link are built from the
# publication's own front matter (authors, year, journal, license).
