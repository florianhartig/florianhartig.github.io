# Projects and networks — single source for /projects/ (shortcode "projects"),
# the counts in the Projects box and the homepage tile.
# status: current | past (an entry with an `end` year before this year counts
# as past automatically). start/end: years. role/funder/grant: fill in where
# known (TODO Florian for past projects). summary: markdown.
projects:
  - name: "BaySenseAI"
    status: current
    start: 2026
    end: 2030
    role: ""
    funder: ""
    url: "https://www.uni-regensburg.de/biologie-vorklinische-medizin/forschen/arbeitsgruppen/ag-hartig/forschung/projects-and-networks/baysenseai"
    summary: >-
      A multi-modal AI platform integrating remote sensing and field data to predict biodiversity across Bavaria at high spatial and temporal resolution. Piloted around Berchtesgaden National Park, the platform is to generate biodiversity predictions on a digital map of Bavaria at large spatial extents and high resolution. Led by Florian Hartig, with Prof. Rupert Seidl (TUM and Berchtesgaden National Park) and Prof. Cornelius Senf (TUM), funded by the Bavarian State Ministry of Science and the Arts, 2026–2030.
  - name: "bAImo"
    status: current
    start: 2026
    end: 2030
    role: ""
    funder: ""
    url: "https://www.uni-regensburg.de/biologie-vorklinische-medizin/forschen/arbeitsgruppen/ag-hartig/forschung/projects-and-networks/baimo"
    summary: >-
      Part of [bayklif2](https://bayklif2.de/en/), the second Bavarian Climate Research Network (2026–2030). Combines AI methods with ecological expertise and monitoring/citizen-science data to support and optimise Bavaria's existing insect-monitoring system. Subproject 1, based at Regensburg and led by Dr. Maximilian Pichler, combines AI with statistical modelling to better capture complex environmental effects and improve the modelling of rare species, using a Deep Joint Species Distribution Model as the methodological basis for the project's other subprojects.
  - name: "DHARMa"
    status: current
    start: 2024
    end: 2027
    role: ""
    funder: ""
    url: "https://www.uni-regensburg.de/biologie-vorklinische-medizin/forschen/arbeitsgruppen/ag-hartig/forschung/projects-and-networks/dharma"
    summary: >-
      Increasing the validity of statistical analyses with the R package [DHARMa](/software/dharma/). DHARMa uses a simulation-based approach to generate easily interpretable residuals for complex regression models, particularly GLMMs, addressing a widespread difficulty in validating such models' statistical assumptions. This DFG-funded phase of the project extends the package's user accessibility and interoperability, adds further diagnostic procedures, and strengthens valid application through testing protocols, in partnership with the R developer community and other package authors. Led by Florian Hartig, with Dr. Melina de Souza Leite and Cosmina Werneke, funded by the Deutsche Forschungsgemeinschaft (DFG, project no. 528747641), 2024–2027.
