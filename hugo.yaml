baseURL: "https://florianhartig.github.io/"
locale: "en-GB"
title: "Florian Hartig"
enableRobotsTXT: true

# No external theme: layouts live in layouts/ and are self-contained, so the
# site builds with no network access and no Go toolchain.

disableKinds: ["taxonomy", "term"]

# llms.txt is generated by layouts/home.llms.txt so it stays in sync with the
# site rather than being a static file that quietly goes stale.
outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home: ["html", "rss", "llms"]

params:
  description: >-
    Florian Hartig is a theoretical ecologist and ecological data scientist,
    Professor at the University of Regensburg, working on biodiversity in
    ecology, evolution and conservation through simulation, statistics and
    machine learning.
  author:
    name: "Florian Hartig"
    givenName: "Florian"
    familyName: "Hartig"
    tagline: "Theoretical Ecology & Ecological Data Science"
    descriptor: "Theoretical ecologist and ecological data scientist"
    # `rank` is the exact German title and is what the site displays.
    # `jobTitle` feeds schema.org, where the plain word is more legible
    # internationally and matches better for entity resolution.
    rank: "W3 Professor"
    jobTitle: "Professor"
    affiliation: "University of Regensburg"
    affiliationURL: "https://www.uni-regensburg.de/"
    profileURL: "https://www.uni-regensburg.de/biologie-vorklinische-medizin/forschen/arbeitsgruppen/ag-hartig/team/prof-dr-florian-hartig"
    groupURL: "https://www.uni-regensburg.de/biologie-vorklinische-medizin/forschen/arbeitsgruppen/ag-hartig"
    teamURL: "https://www.uni-regensburg.de/biologie-vorklinische-medizin/forschen/arbeitsgruppen/ag-hartig/team"
    # There is deliberately no `email` key here. No e-mail address is to be
    # displayed on this site, in the contact block or in the JSON-LD. The
    # contact block links the university profile and group pages instead,
    # which carry current contact details.
  address:
    institution: "University of Regensburg"
    faculty: "Faculty of Biology and Preclinical Medicine"
    street: "Universitätsstraße 31"
    postalCode: "93053"
    city: "Regensburg"
    country: "Germany"
    countryCode: "DE"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: "friendly"
  tableOfContents:
    startLevel: 2
    endLevel: 3

menus:
  main:
    - name: "About"
      pageRef: "/"
      weight: 10
    - name: "Publications"
      pageRef: "/publications"
      weight: 20
    - name: "Software"
      pageRef: "/software"
      weight: 30
    - name: "Teaching"
      pageRef: "/teaching"
      weight: 40
    - name: "CV"
      pageRef: "/cv"
      weight: 50
