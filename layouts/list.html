{{ define "main" }}
<div class="wrap wrap-narrow">
  <article class="page">
    <h1>{{ .Title }}</h1>
    <div class="prose">
      {{ .Content }}
    </div>

    {{- with .RegularPages }}
    <div class="card-grid card-grid-list">
      {{- range .ByWeight }}
      <article class="card">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{- with .Params.summary }}<p>{{ . }}</p>{{ end }}
      </article>
      {{- end }}
    </div>
    {{- end }}
  </article>
</div>
{{ end }}
