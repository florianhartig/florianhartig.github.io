{{- /* Homepage profile links: only the primary profiles. All profiles are in
       the footer and in the JSON-LD `sameAs` array (schema.html). */ -}}
<div class="social">
  <ul class="social-primary">
    {{- range where hugo.Data.social "primary" true }}
    <li><a href="{{ .url }}" rel="me noopener">{{ .name }}</a></li>
    {{- end }}
  </ul>
</div>
