<footer class="site-footer">
  <div class="wrap wrap-narrow">
    <div class="footer-links">
      <span class="footer-links-label">Links to other web profiles:</span>
      {{- range hugo.Data.social }}
      <a href="{{ .url }}" rel="{{ if ne .person false }}me {{ end }}noopener">{{ .name }}</a>
      {{- end }}
    </div>
    <p class="footer-meta">
      © {{ now.Format "2006" }} {{ site.Params.author.name }}.
      Built with <a href="https://gohugo.io/" rel="noopener">Hugo</a>.
      {{- with site.Lastmod }} Last updated {{ .Format "2 January 2006" }}.{{ end }}
      <a href="{{ "/impressum/" | relURL }}">Impressum</a>
    </p>
  </div>
</footer>
