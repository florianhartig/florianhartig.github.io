<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-name">{{ site.Params.author.name }}</span>
      <span class="brand-tagline">{{ site.Params.author.tagline }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {{- range site.Menus.main }}
        {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
        <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
